plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
    id 'kotlin-kapt'
}

android {
    namespace 'com.sultanagung1.sista'
    compileSdk 35

    defaultConfig {
        applicationId "com.sultanagung1.sista"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "2.0"

        testInstrumentationRunner "com.sultanagung1.sista.e2e.SistaTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-Xcontext-receivers",
            "-opt-in=androidx.compose.animation.ExperimentalSharedTransitionApi",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi"
        ]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-metadata-jvm:2.2.10"
    }
}

dependencies {
    // FASE 73.1: :app is the thin shell — Application class, MainActivity,
    // root AppNavigation/NavGraphs, AppWidget providers, and the Hilt DI
    // wiring files (di/NetworkModule.kt, RepositoryModule.kt, StorageModule.kt
    // — left as single files here rather than split per-module, since :app
    // is the one place already allowed to see every module at once).
    implementation project(':core:model')
    implementation project(':core:common')
    implementation project(':core:database')
    implementation project(':core:network')
    implementation project(':core:designsystem')
    implementation project(':core:data')

    implementation project(':feature:auth')
    implementation project(':feature:home')
    implementation project(':feature:academic')
    implementation project(':feature:cbt')
    implementation project(':feature:finance')
    implementation project(':feature:ibadah')
    implementation project(':feature:chat')
    implementation project(':feature:profile')
    implementation project(':feature:parent')
    implementation project(':feature:teacher')
    implementation project(':feature:admin')

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material3.windowsizeclass
    implementation libs.androidx.compose.material3.adaptive
    implementation libs.androidx.compose.material3.adaptive.layout
    implementation libs.androidx.compose.material3.adaptive.navigation
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.text.google.fonts
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    implementation libs.kotlinx.serialization.json

    // Networking (Retrofit & OkHttp) — for di/NetworkModule.kt's own
    // Retrofit/OkHttpClient construction.
    implementation libs.retrofit.core
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging

    // Room Database Runtime — di/StorageModule.kt provides SistaDatabase.
    implementation libs.room.runtime
    implementation libs.room.ktx

    // Hardware Sensors & Security
    implementation libs.play.services.location
    implementation libs.androidx.biometric
    implementation libs.androidx.datastore.preferences

    // Image Loading
    implementation libs.coil.compose

    // Dependency Injection (Hilt)
    implementation libs.hilt.android
    implementation libs.androidx.hilt.navigation.compose
    kapt libs.hilt.compiler
    kapt libs.kotlin.metadata.jvm

    // Firebase Crashlytics, Performance & Observability
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.crashlytics
    implementation libs.firebase.perf
    implementation libs.firebase.analytics
    implementation libs.firebase.messaging
    implementation libs.kotlinx.coroutines.play.services

    testImplementation libs.junit
    // Screen::class.sealedSubclasses / .objectInstance in
    // TypeSafeNavigationTest need kotlin-reflect at runtime — the basic
    // ::class members (simpleName, java) work without it, but full
    // reflection (sealedSubclasses, objectInstance) throws
    // KotlinReflectionNotSupportedError without this on the classpath.
    testImplementation libs.kotlin.reflect
    // FASE 74.2: real loopback HTTP server for network-contract JVM tests
    // (ETag/Last-Modified headers, error-body safety) — exercises the real
    // Retrofit/OkHttp/Gson stack instead of hand-rolled fakes.
    testImplementation libs.okhttp.mockwebserver
    // FASE 77: decode the drawn class-session QR back in SulaoneQrCodeTest.
    testImplementation libs.zxing.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.hilt.android.testing
    kaptAndroidTest libs.hilt.compiler
    debugImplementation libs.androidx.compose.ui.test.manifest
    debugImplementation libs.androidx.compose.ui.tooling
}
