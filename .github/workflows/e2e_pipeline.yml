name: "SISTA Android E2E, Appium & Device Stress Pipeline"

# FASE 74: unlike android_ci.yml's fast unit-test job (which already covers
# the FASE 74.2 network-contract tests via testDebugUnitTest — no changes
# needed there), this pipeline needs a booted emulator + a live Appium
# server, so it does NOT run on every push/PR: it's manual or nightly only.
on:
  workflow_dispatch:
    inputs:
      exam_token:
        description: "6-digit token from a currently-active seeded exam (E2E_CBT_EXAM_TOKEN)"
        required: true
  schedule:
    # 02:00 WIB daily. A stale exam token will make the CBT scenario fail
    # fast with a clear error rather than silently skip — a real seeded
    # exam window must exist for that scheduled run to be meaningful.
    - cron: "0 19 * * *"

jobs:
  e2e-appium:
    name: Appium E2E + Monkey Stress + Memory/ANR Budget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x e2e/scripts/*.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Enable KVM (required for a hardware-accelerated emulator on Actions runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # One emulator boot for the whole job: 74.1 (Appium E2E), then 74.3
      # (monkey stress + memory/ANR/dropped-frame budget) reuse the same
      # running instance and app process. Three separate emulator-runner
      # steps would each cold-boot a fresh emulator, which is both far
      # slower and pointless here — 74.3's budget check is specifically
      # meant to measure the app AFTER the E2E flow + monkey churn, not a
      # freshly-installed, never-touched process.
      - name: Boot emulator, run Appium E2E, then monkey stress + budget check
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_STUDENT_ID: ${{ secrets.E2E_STUDENT_ID }}
          E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
          E2E_CBT_EXAM_TOKEN: ${{ github.event.inputs.exam_token || secrets.E2E_CBT_EXAM_TOKEN_NIGHTLY }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "== FASE 74.1: Appium E2E =="
            npm install -g appium
            appium driver install uiautomator2
            appium --allow-cors &
            APPIUM_PID=$!
            sleep 10
            (cd e2e && chmod +x gradlew || true; ./gradlew test --console=plain)
            kill $APPIUM_PID || true

            echo "== FASE 74.3: Monkey stress test =="
            e2e/scripts/monkey_stress_test.sh com.sultanagung1.sista 800

            echo "== FASE 74.3: Memory/ANR/dropped-frame budget =="
            e2e/scripts/memory_anr_budget_check.sh com.sultanagung1.sista

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-appium-report
          path: e2e/build/reports/tests/test/
