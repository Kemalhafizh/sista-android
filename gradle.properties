# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# JDK is machine-specific: do not pin org.gradle.java.home here. A Windows path
# in this shared file broke every CI run ("Java home supplied is invalid" on the
# Linux runner, before any compilation). Pick the JDK per machine instead:
# Android Studio → Settings → Build Tools → Gradle → Gradle JDK, or
# org.gradle.java.home in your user-level ~/.gradle/gradle.properties.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.0 Compatibility Flags
android.builtInKotlin=false
android.newDsl=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.r8.optimizedResourceShrinking=false

# Suppress Deprecated AGP Warnings in Android Studio & Terminal
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# FASE 73.3: Gradle Build Speed Optimization — meaningful now that the build
# graph is a real multi-module DAG (single :app module has nothing to
# parallelize or cache incrementally against).
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
