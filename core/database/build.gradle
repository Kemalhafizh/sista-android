plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
}

// FASE 73.1: Room database, DAOs, entities, and SulaoneLocalStore — the only
// module allowed to touch the local SQLite store directly (per 73.2, other
// modules go through :core:data's repositories instead).
android {
    namespace 'com.sultanagung1.sista.data.local'
    compileSdk 35

    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-Xcontext-receivers"
        ]
    }
}

dependencies {
    implementation project(':core:model')

    implementation libs.androidx.core.ktx
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler
    implementation libs.sqlcipher
    implementation libs.gson
}
