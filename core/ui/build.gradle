plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.roborazzi)
}

// Design system v2: theme (colour, type, shape, spacing), the component set
// every rebuilt screen is made of, and the standard screen-state contract
// (UiState + StatefulContent). Deliberately free of any app/data dependency
// so each piece can be previewed and screenshot-tested in isolation.
//
// The old :core:designsystem stays until every screen has moved over.
android {
    namespace 'com.sultanagung1.sista.core.ui'
    compileSdk 37

    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"]
    }
    testOptions {
        unitTests {
            // Robolectric needs merged resources (fonts, strings) to render.
            includeAndroidResources = true
        }
    }
}

// Screenshots land here; recorded with `./gradlew :core:ui:recordRoborazziDebug`.
roborazzi {
    outputDir = file("screenshots")
}

dependencies {
    api platform(libs.androidx.compose.bom)
    api libs.androidx.compose.material3
    api libs.androidx.compose.foundation
    api libs.androidx.compose.ui
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.roborazzi
    testImplementation libs.roborazzi.compose
    testImplementation libs.roborazzi.junit.rule
    testImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
}
